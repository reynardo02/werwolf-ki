[project]
name = "werwolf-ki"
version = "0.1.0"
description = "LLM-Agenten spielen Werwolf gegeneinander"
requires-python = ">=3.12"
dependencies = ["openai>=1.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["core", "werwolf", "web"]

[tool.setuptools.package-data]
werwolf = ["prompts/*.txt"]
